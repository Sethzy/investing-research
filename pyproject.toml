[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "investing-research"
version = "0.1.0"
description = "Standalone, no-key investing research for subscribed agent sessions"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "typer>=0.16,<1",
  "pydantic>=2.11,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "pypdf>=5,<7",
  "browser-cookie3>=0.20.1,<1",
  "financetoolkit>=2,<3",
  "scipy>=1.15,<2",
  "matplotlib>=3.10,<4",
  "xlsxwriter>=3.2,<4",
  "openpyxl>=3.1,<4",
  "filelock>=3.18,<4",
  "psutil>=7,<8",
  "reportlab>=4,<5",
]

[project.optional-dependencies]
documents = ["docling>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "pip-audit>=2.9,<3"]

[project.scripts]
invest = "investing_research.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/investing_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
